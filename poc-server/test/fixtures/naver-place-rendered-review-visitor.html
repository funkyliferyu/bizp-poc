<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta property="og:title" content="분당 케이크하우스 방문자리뷰 : 네이버 플레이스" />
  </head>
  <body>
    <main>
      <h1>분당 케이크하우스</h1>
      <section aria-label="방문자 리뷰 키워드">
        <h2>이런 점이 좋았어요</h2>
        <button>디저트가 맛있어요</button>
        <button>친절해요</button>
        <button>선물하기 좋아요</button>
      </section>
      <section aria-label="방문자 리뷰 목록">
        <article
          data-review-card
          data-review-id="visitor-review-1001"
          data-reviewer="케이크러버"
          data-review-date="2026.06.01"
          data-rating="5"
          data-source-url="https://m.place.naver.com/restaurant/1838952735/review/visitor#visitor-review-1001"
          data-media="true"
        >
          <p class="review-body">레터링 케이크 문구가 깔끔했고 당일 픽업 안내가 친절했어요.</p>
          <ul>
            <li data-review-keyword>디저트가 맛있어요</li>
            <li data-review-keyword>포장이 꼼꼼해요</li>
          </ul>
          <div class="owner-reply" data-owner-reply>소중한 리뷰 감사합니다. 다음에도 예쁘게 준비해드릴게요.</div>
        </article>
        <article
          data-review-card
          data-review-id="visitor-review-1002"
          data-reviewer="정자디저트"
          data-review-date="2026.05.28"
          data-rating="4"
          data-source-url="https://m.place.naver.com/restaurant/1838952735/review/visitor#visitor-review-1002"
        >
          <p class="review-body">크림이 많이 달지 않아서 가족 생일 케이크로 좋았습니다.</p>
          <ul>
            <li data-review-keyword>선물하기 좋아요</li>
            <li data-review-keyword>매장이 청결해요</li>
          </ul>
        </article>
        <article
          data-review-card
          data-review-id="visitor-review-1003"
          data-reviewer="분당맘"
          data-review-date="2026.05.25"
          data-rating="5"
          data-source-url="https://m.place.naver.com/restaurant/1838952735/review/visitor#visitor-review-1003"
          data-video="true"
        >
          <p class="review-body">아이 취향 색상으로 맞춰줘서 사진이 예쁘게 나왔어요.</p>
          <ul>
            <li data-review-keyword>맞춤 제작을 잘해요</li>
            <li data-review-keyword>응대가 빨라요</li>
          </ul>
        </article>
      </section>
    </main>
  </body>
</html>
