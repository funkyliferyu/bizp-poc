<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Collection RAW data</title>
<link rel="stylesheet" href="common.css">
<script src="icons.js" defer></script>
<style>
.raw-wrap{padding:32px;max-width:1040px;margin:0 auto}
.raw-header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px}
.raw-title{font-size:20px;font-weight:800;color:#1A1A2E;margin-bottom:6px}
.raw-desc{font-size:12px;color:#6B7280;line-height:1.6}
.raw-store{font-size:12px;color:#3B5BDB;font-weight:700}
.raw-card{border:1px solid #E2E8F0;border-radius:8px;background:#fff;overflow:hidden}
.raw-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;background:#F7F8FA;border-bottom:1px solid #E2E8F0}
.raw-tabs{display:flex;flex-wrap:wrap;gap:6px}
.raw-tab{height:28px;padding:0 10px;border:1px solid #D8E0EC;border-radius:6px;background:#fff;color:#4A5568;font-size:12px;font-weight:700;font-family:'Noto Sans KR',sans-serif;cursor:pointer}
.raw-tab.active{border-color:#3B5BDB;background:#EEF2FF;color:#3B5BDB}
.raw-actions{display:flex;gap:8px}
.raw-body{display:grid;grid-template-columns:280px 1fr;min-height:520px}
.raw-summary{padding:16px;border-right:1px solid #E2E8F0;background:#FAFBFC}
.summary-title{font-size:12px;font-weight:800;color:#1A1A2E;margin-bottom:10px}
.summary-row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid #EDF2F7;font-size:12px;color:#4A5568}
.summary-row strong{color:#1A1A2E}
.raw-json-wrap{padding:16px;overflow:auto}
.raw-json{margin:0;padding:14px;border:1px solid #E8EEF7;border-radius:6px;background:#0F172A;color:#E5E7EB;font-size:12px;line-height:1.55;white-space:pre-wrap;word-break:break-word;min-height:460px}
.json-key{color:#60A5FA;font-weight:800}
.json-string{color:#86EFAC}
.json-number{color:#FBBF24}
.json-boolean{color:#C4B5FD;font-weight:700}
.json-null{color:#FCA5A5;font-style:italic}
.json-punctuation{color:#94A3B8}
.raw-message{padding:16px;border:1px solid #FED7AA;border-radius:8px;background:#FFF7ED;color:#C2410C;font-size:13px;line-height:1.6}
@media (max-width:760px){
  .raw-wrap{padding:20px}
  .raw-header{flex-direction:column}
  .raw-body{grid-template-columns:1fr}
  .raw-summary{border-right:none;border-bottom:1px solid #E2E8F0}
}
</style>
</head>
<body>
<div class="raw-wrap">
  <div class="raw-header">
    <div>
      <div class="raw-title">Collection RAW data</div>
      <div class="raw-desc">수집 실행과 collection_items 원본 데이터를 서버 API로 조회해 확인합니다. 이 화면은 Naver나 OpenAI를 직접 호출하지 않습니다.</div>
    </div>
    <div id="raw-store-label" class="raw-store"></div>
  </div>

  <div id="raw-error" class="raw-message" hidden></div>

  <div class="raw-card" id="raw-card">
    <div class="raw-toolbar">
      <div id="raw-section-tabs" class="raw-tabs"></div>
      <div class="raw-actions">
        <button type="button" id="raw-copy-button" class="btn btn-ghost">복사</button>
      </div>
    </div>
    <div class="raw-body">
      <aside class="raw-summary">
        <div class="summary-title">요약</div>
        <div id="raw-summary"></div>
      </aside>
      <main class="raw-json-wrap">
        <pre id="raw-json" class="raw-json">{}</pre>
      </main>
    </div>
  </div>
</div>
<script src="collection_raw_data.js"></script>
</body>
</html>
