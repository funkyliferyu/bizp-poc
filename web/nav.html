<script>
function navigateMain(event, el){
  setActive(el);
  const href = el.getAttribute('href');
  if (window.parent && window.parent !== window && typeof window.parent.navigateMainFrame === 'function') {
    event.preventDefault();
    window.parent.navigateMainFrame(href);
  }
}

function toggleRef(){
  const links = document.getElementById('ref-links');
  const arrow = document.getElementById('ref-arrow');
  const open = links.style.display === 'none';
  links.style.display = open ? 'block' : 'none';
  arrow.setAttribute('data-icon', open ? 'chevron-down' : 'chevron-right');
  // 아이콘 직접 갱신
  const size = 12, color = 'rgba(255,255,255,.25)';
  const paths = {
    'chevron-down': '<polyline points="6 9 12 15 18 9"/>',
    'chevron-right': '<polyline points="9 18 15 12 9 6"/>'
  };
  const name = arrow.getAttribute('data-icon');
  arrow.outerHTML = `<svg id="ref-arrow" data-icon="${name}" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block;vertical-align:middle;flex-shrink:0">${paths[name]}</svg>`;
}

function setActive(el){
  document.querySelectorAll('a.sb-item').forEach(a=>a.classList.remove('active'));
  el.classList.add('active');
}
// 첫 항목 활성화
document.querySelector('a.sb-item').classList.add('active');
</script>
