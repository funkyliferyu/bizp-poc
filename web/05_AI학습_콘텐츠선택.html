<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Noto Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">

<style>
.check-cell{width:32px;text-align:center}
.fake-check{width:14px;height:14px;border-radius:3px;border:1.5px solid #E2E8F0;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;vertical-align:middle}
.fake-check.on{background:#3B5BDB;border-color:#3B5BDB}
.ai-suspect{font-size:10px;padding:1px 6px;border-radius:10px;background:#F7F8FA;color:#9AA0B4;border:1px solid #E2E8F0;margin-left:4px}
tr.unchecked td{color:#9AA0B4}
.selection-empty{padding:14px 12px;font-size:12px;color:#9AA0B4}
.selection-place-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #EEF1F6}
.selection-place-row:last-child{border-bottom:0}
.selection-place-title{flex:1;min-width:0;font-size:12px;color:#252733;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.selection-meta{font-size:11px;color:#9AA0B4}
</style>
</head>
<body>
<script src="icons.js"></script>
<div class="topbar">
  <div class="topbar-breadcrumb">마케팅 채널관리 &rsaquo; AI 학습 &rsaquo; <span>분석 콘텐츠 선택</span></div>
</div>
<div class="main-content">
  <div class="page-title">수집 완료 — 분석할 콘텐츠 선택</div>
  <div style="font-size:13px;color:#4A5568;margin-bottom:16px">수집된 콘텐츠 중 분석에 포함할 항목을 선택하세요.</div>

  <div class="err-banner warning" style="margin-bottom:16px">
    <div class="err-title"><span class="icon-alert-triangle" data-icon="alert-triangle" data-size="14" data-color="currentColor"></span> AI 작성 의심 콘텐츠 안내</div>
    <div class="err-desc">AI가 작성한 글을 분석에 포함하면 룰셋이 왜곡될 수 있습니다. 'AI 작성 의심' 표시된 항목은 기본적으로 체크 해제되어 있습니다. 직접 작성하거나 직접 발행한 글만 선택하는 것을 권장합니다.</div>
  </div>

  <div class="card">
    <div class="card-header">
      <span style="display:flex;align-items:center;gap:6px"><span class="icon-rss" data-icon="rss" data-size="14" data-color="#03C75A"></span> 네이버 블로그 <span id="selection-blog-count" style="font-size:11px;color:#9AA0B4;font-weight:400">· 로딩 중</span></span>
    </div>
    <div class="card-body" style="padding:0">
      <table class="tbl" style="table-layout:fixed">
        <thead>
          <tr>
            <th class="check-cell">
              <div class="fake-check on" style="margin:0 auto"><svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg></div>
            </th>
            <th style="width:auto">제목</th>
            <th style="width:64px">발행일</th>
            <th style="width:60px">조회수</th>
          </tr>
        </thead>
        <tbody id="selection-blog-list">
          <tr><td colspan="4" class="selection-empty">수집 콘텐츠를 불러오는 중입니다.</td></tr>
        </tbody>
      </table>
      <div id="selection-blog-visible-count" style="padding:10px 12px;font-size:11px;color:#9AA0B4">-</div>
    </div>
  </div>

  <div class="card">
    <div class="card-header">
      <span style="display:flex;align-items:center;gap:6px"><span class="icon-map-pin" data-icon="map-pin" data-size="14" data-color="#03C75A"></span> 네이버 플레이스 <span id="selection-place-count" style="font-size:11px;color:#9AA0B4;font-weight:400">· 로딩 중</span></span>
    </div>
    <div class="card-body" id="selection-place-list">
      <div class="selection-empty">수집 콘텐츠를 불러오는 중입니다.</div>
    </div>
  </div>

  <div style="display:flex;justify-content:space-between;align-items:center;margin-top:4px">
    <span id="selection-selected-count" style="font-size:12px;color:#4A5568">0개 선택됨</span>
    <div style="display:flex;gap:8px">
      <button class="btn btn-ghost" onclick="history.back()">이전</button>
      <button class="btn btn-primary" id="selection-analysis-btn" data-flow-target="06_AI학습_현황.html" data-flow-label="다음: 학습 현황" disabled>분석 실행</button>
    </div>
  </div>
</div>
<script src="content_selection.js"></script>
</body>
</html>
