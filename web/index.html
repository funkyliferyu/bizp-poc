<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>BizPlanet — 마케팅 채널관리 시안</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;overflow:hidden}
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap');
.frame-wrap{display:flex;height:100vh}
.nav-frame{width:200px;flex-shrink:0;border-right:1px solid #E2E8F0}
.main-frame{flex:1}
</style>
</head>
<body>
<script src="icons.js"></script>
<script>
window.navigateMainFrame = function(path){
  const mainFrame = document.getElementById('mainFrame');
  if (!mainFrame || !path) return;
  const cacheBust = Date.now();
  const [basePath, hash = ''] = path.split('#');
  const joiner = basePath.includes('?') ? '&' : '?';
  const nextUrl = `${basePath}${joiner}v=${cacheBust}${hash ? `#${hash}` : ''}`;
  mainFrame.src = nextUrl;
};
</script>
<div class="frame-wrap">
  <iframe src="nav.html" class="nav-frame" frameborder="0" name="nav"></iframe>
  <iframe src="soho_dashboard.html" class="main-frame" frameborder="0" name="main" id="mainFrame"></iframe>
</div>
<script src="flow-guide.js"></script>
</body>
</html>
